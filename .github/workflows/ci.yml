name: CI

on:
  pull_request:
  push:
    branches:
      - integrate/unified-admin

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build check (validate + render check)
        run: npm run build:check

      - name: Test
        run: npm test
