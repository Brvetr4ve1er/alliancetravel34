# .github/workflows/backup-leads.yml
# Weekly automated backup of the leads (customer inquiries) table to a workflow
# artifact. Leads live only in Supabase and are otherwise backed up nowhere; this
# is the safety net.
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED REPO SECRET (Settings → Secrets and variables → Actions → New secret):
#
#   SUPABASE_SERVICE_ROLE_KEY   (REQUIRED — this is the ONLY thing that activates
#                                the backup) The Supabase service-role key. It can
#                                read the whole `leads` table past row-level
#                                security. Keep it secret: it is NOT the public
#                                anon key in site/assets/js/lead-config.js.
#
#   BACKUP_PASSPHRASE           (REQUIRED for the upload step) A strong passphrase.
#                                The CSV is GPG-encrypted (AES256, symmetric) with it
#                                BEFORE being uploaded. This repo is PUBLIC, and on a
#                                public repo Actions artifacts are downloadable by
#                                anyone — a plaintext customer list must never land
#                                there. Decrypt locally with:
#                                  gpg --decrypt leads-<date>.csv.gpg > leads.csv
#
# OPTIONAL REPO SECRET:
#
#   SUPABASE_URL                (optional) The Supabase project URL. Defaults to the
#                                known public project URL below if the secret is
#                                empty, so most owners only need the key above.
#
# Until BOTH secrets are set, this workflow is a deliberate no-op: it runs, warns
# which secret is missing, and exits 0 (green) — it never fails a run just because
# a secret is missing, and it NEVER uploads plaintext PII. Secrets are passed
# through env only and are never echoed; GitHub also masks them in logs.
# ─────────────────────────────────────────────────────────────────────────────

name: Backup leads

on:
  schedule:
    # Every Monday at 03:17 UTC. (Off-peak; odd minute to avoid the top-of-hour rush.)
    - cron: "17 3 * * 1"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set — skipping lead backup."
            echo "This is expected until the owner adds the secret; the run is intentionally a no-op."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${BACKUP_PASSPHRASE}" ]; then
            # PII gate: this repo is public and its artifacts are world-downloadable.
            # Without a passphrase to encrypt with, uploading the leads CSV would
            # publish every customer's name and phone — refuse rather than leak.
            echo "::warning::BACKUP_PASSPHRASE is not set — skipping lead backup (a plaintext customer list must never be uploaded as an artifact of a public repo)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "Both secrets present — proceeding with encrypted backup."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export leads to CSV and encrypt
        id: export
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          # Public project URL fallback; override with a SUPABASE_URL secret if the project moves.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vxblgxiamtphabfswnxb.supabase.co' }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          FILE="leads-${DATE}.csv"
          # PostgREST returns CSV directly with Accept: text/csv (header row included,
          # even for an empty table). --fail surfaces a real HTTP error (e.g. a bad key)
          # as a non-zero exit; the secret is passed via header from env, never printed.
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: text/csv" \
            "${SUPABASE_URL}/rest/v1/leads?select=*&order=created_at.desc" \
            -o "${FILE}"
          LINES="$(wc -l < "${FILE}" | tr -d ' ')"
          echo "Exported ${LINES} line(s) including the header."
          # Encrypt BEFORE upload: artifacts of a public repo are world-downloadable,
          # so only ciphertext may leave this job. Passphrase comes from env (never
          # a CLI arg, which would show in the process list). shred the plaintext.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 --pinentry-mode loopback \
            --output "${FILE}.gpg" "${FILE}" 3<<<"${BACKUP_PASSPHRASE}"
          shred -u "${FILE}"
          echo "Encrypted to ${FILE}.gpg — plaintext removed."
          echo "file=${FILE}.gpg" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup artifact
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leads-backup-${{ github.run_id }}
          path: ${{ steps.export.outputs.file }}
          retention-days: 90
          if-no-files-found: error
